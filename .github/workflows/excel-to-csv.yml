name: Convert Excel to CSV

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight (optional)
  workflow_dispatch: # Allows manual trigger

jobs:
  convert-excel-to-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas openpyxl

      - name: Run Python Script to Convert Excel to CSV
        run: python convert_excel_to_csv.py

      - name: Commit and Push CSV Files
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add csv_output/*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-converted Excel files to CSV"
          git push origin staging
        continue-on-error: true

