name: Convert Excel to CSV

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  convert-excel-to-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Use GitHub's built-in token

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas openpyxl

      - name: Run Python Script to Convert Excel to CSV
        run: python convert_excel_to_csv.py

      - name: Commit and Push CSV Files
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add csv_output/*.csv
          git commit -m "Auto-converted Excel files to CSV" || echo "No changes to commit"
          git push origin staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use GitHub Token for authentication
        continue-on-error: true

